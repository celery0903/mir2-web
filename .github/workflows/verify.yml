name: Docker and Browser Verification
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: docker compose up -d --build --wait --wait-timeout 120
      - run: npm run test:protocol
      - run: npm test
      - run: docker compose stop game web
      - name: Verify graceful shutdown
        run: |
          test "$(docker inspect --format '{{.State.ExitCode}}' "$(docker compose ps -aq game)")" = "0"
          test "$(docker inspect --format '{{.State.ExitCode}}' "$(docker compose ps -aq web)")" = "0"
      - run: docker compose up -d --wait --wait-timeout 120
      - run: npm run test:persistence
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-verification
          path: test-results/
          retention-days: 7
      - if: always()
        run: docker compose down
