services:
  db:
    image: mysql:8.4
    env_file: .runtime/openmir2/database.env
    restart: unless-stopped
    volumes:
      - openmir2-db:/var/lib/mysql
      - ./.runtime/openmir2/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysql -h127.0.0.1 -uroot -e "SELECT 1" >/dev/null 2>&1']
      interval: 3s
      timeout: 3s
      retries: 60
    networks: [internal]
  engine:
    build:
      context: .
      dockerfile: server/Engine/Dockerfile
    env_file: .runtime/openmir2/database.env
    depends_on:
      db:
        condition: service_healthy
    init: true
    restart: unless-stopped
    stop_grace_period: 45s
    volumes:
      - openmir2-engine:/data
    networks:
      - internal
  web:
    build:
      context: .
      dockerfile: server/SourceClient/Dockerfile
    init: true
    restart: unless-stopped
    environment:
      GAME_HOST: engine
    volumes:
      - ./.runtime/source-assets:/usr/share/nginx/resources:ro
    ports:
      - "${MIR_BIND:-0.0.0.0}:${MIR_PORT:-18880}:8080"
    depends_on:
      engine:
        condition: service_healthy
      source-proxy:
        condition: service_healthy
    networks:
      - internal
      - public
  source-proxy:
    build:
      context: .
      dockerfile: server/SourceProxy/Dockerfile
    init: true
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:8800
      MIR2_ENGINE_HOST: engine
      MIR2_WEB_ORIGINS: ${MIR_SOURCE_ORIGINS:-http://127.0.0.1:${MIR_PORT:-18880},http://localhost:${MIR_PORT:-18880},http://172.30.0.16:${MIR_PORT:-18880}}
    depends_on:
      engine:
        condition: service_healthy
    networks: [internal]
volumes:
  openmir2-db:
  openmir2-engine:
networks:
  internal:
    internal: true
  public:
