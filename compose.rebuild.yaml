services:
  db:
    image: mysql:8.4
    env_file: .runtime/openmir2/database.env
    volumes:
      - openmir2-db:/var/lib/mysql
      - ./.runtime/openmir2/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysql -h127.0.0.1 -uroot -e "SELECT 1" >/dev/null 2>&1']
      interval: 3s
      timeout: 3s
      retries: 60
  engine:
    build:
      context: .
      dockerfile: server/Engine/Dockerfile
    env_file: .runtime/openmir2/database.env
    environment:
      MIR_PROTOCOL_TRACE: '1'
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - openmir2-engine:/data
    init: true
    stop_grace_period: 45s
    ports:
      - '127.0.0.1:17700:7000'
      - '127.0.0.1:17710:7100'
      - '127.0.0.1:17720:7200'
      - '127.0.0.1:18882:8081'
  web:
    build:
      context: .
    depends_on:
      engine:
        condition: service_healthy
    environment:
      GAME_HOST: engine
      MIR_PROTOCOL_TRACE: '1'
    ports:
      - '0.0.0.0:18883:8080'
volumes:
  openmir2-db:
  openmir2-engine:
