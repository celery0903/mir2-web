events {}
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    server {
        listen 8080;
        root /usr/share/nginx/html;
        location = / { try_files /play.html =404; }
        location / { try_files $uri =404; }
        location ~ ^/(actors|effects|items|ui|ui-national|audio|libraries|maps)/ {
            root /usr/share/nginx/resources;
            try_files $uri =404;
        }
        location = /health { proxy_pass http://source-proxy:8800/health; }
        location = /ws {
            proxy_pass http://source-proxy:8800/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_read_timeout 90s;
            proxy_send_timeout 90s;
        }
    }
}
